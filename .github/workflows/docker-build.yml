name: Build, Push & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/previsao-app:latest
            ${{ secrets.DOCKER_USERNAME }}/previsao-app:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    # Só deploya em push para main (não em PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.EC2_PATH }}

            echo "📦 [1/5] Backup pré-deploy..."
            BKP=~/backups/predeploy_$(date +%Y%m%d_%H%M%S)
            mkdir -p $BKP
            cp usuarios_config.json $BKP/ 2>/dev/null || true
            cp .env $BKP/ 2>/dev/null || true
            cp db.sqlite3 $BKP/ 2>/dev/null || true
            echo "    backup em $BKP"

            echo "🔄 [2/5] Baixando imagem sha-${{ needs.build.outputs.short_sha }}..."
            docker-compose pull

            echo "🚀 [3/5] Recriando container..."
            docker-compose up -d

            echo "⏳ [4/5] Aguardando healthcheck (40s)..."
            sleep 40
            docker-compose ps

            echo "🧹 [5/5] Limpando imagens antigas (mantém últimas 5)..."
            docker image prune -f

            # Mantém apenas as 5 backup-folders mais recentes
            ls -1dt ~/backups/predeploy_* 2>/dev/null | tail -n +6 | xargs -r rm -rf || true

            echo "✅ Deploy concluído: sha-${{ needs.build.outputs.short_sha }}"
