name: Diagnose ENV and service token

# Workflow manual — você dispara pelo botão "Run workflow" na aba Actions.
# Faz diagnóstico do .env e do service token no EC2, sem expor senhas.

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnose via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -e
            cd ${{ secrets.EC2_PATH }}

            echo "============================================================"
            echo "1. .env DO HOST (em $(pwd)/.env)"
            echo "============================================================"
            grep -E "^API_USERNAME|^API_PASSWORD|^API_BASE_URL|^CLIENT_ID|^CLIENT_SECRET" .env | sed 's/\(API_PASSWORD=\).*/\1***[oculto]***/' | sed 's/\(CLIENT_SECRET=\).*/\1***[oculto]***/'
            echo ""

            echo "============================================================"
            echo "2. .env DO CONTAINER (em /app/.env)"
            echo "============================================================"
            docker exec previsao-app-web-1 sh -c 'grep -E "^API_USERNAME|^API_PASSWORD|^API_BASE_URL|^CLIENT_ID|^CLIENT_SECRET" /app/.env' | sed 's/\(API_PASSWORD=\).*/\1***[oculto]***/' | sed 's/\(CLIENT_SECRET=\).*/\1***[oculto]***/'
            echo ""

            echo "============================================================"
            echo "3. O QUE O PYTHON LÊ (via get_dynamic_config)"
            echo "============================================================"
            docker exec previsao-app-web-1 python -c "
            from core.views import get_dynamic_config, _service_token_cache
            _service_token_cache['token'] = None
            for key in ['API_BASE_URL', 'API_USERNAME', 'API_PASSWORD', 'CLIENT_ID', 'CLIENT_SECRET']:
                v = get_dynamic_config(key)
                if v is None:
                    print(f'{key} = NONE (nao definido)')
                elif key in ('API_PASSWORD', 'CLIENT_SECRET'):
                    print(f'{key} = [oculto] tamanho={len(v)}')
                else:
                    print(f'{key} = [{v}] tamanho={len(v)}')
            "
            echo ""

            echo "============================================================"
            echo "4. TESTE: gera token com credenciais lidas"
            echo "============================================================"
            docker exec previsao-app-web-1 python -c "
            from core.views import get_service_token, _service_token_cache
            _service_token_cache['token'] = None
            t = get_service_token(force_refresh=True)
            if t:
                print(f'TOKEN OK (primeiros 30 chars): {t[:30]}...')
            else:
                print('TOKEN FALHOU — ver logs do container')
            "
            echo ""

            echo "============================================================"
            echo "5. LOGS RECENTES DO CONTAINER (filtrando token/erro)"
            echo "============================================================"
            docker logs previsao-app-web-1 --tail=200 2>&1 | grep -iE "service token|api_username|gerar_token|access_token|403|401|❌" | tail -30
            echo ""

            echo "============================================================"
            echo "6. CONTAINER STATUS"
            echo "============================================================"
            docker ps --filter "name=previsao-app" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
